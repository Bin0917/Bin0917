<svg xmlns="http://www.w3.org/2000/svg" width="840" height="24" viewBox="0 0 840 24">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#00E6A8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E6A8"/>
      <stop offset="1" stop-color="#00E6A8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#CFFFF0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#CFFFF0"/>
      <stop offset="1" stop-color="#CFFFF0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="40" y="8" width="760" height="8"/></clipPath>
    <filter id="soft" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="40" y="10" width="760" height="4" fill="url(#line)" filter="url(#soft)" opacity="0.8"/>
  <rect x="40" y="11" width="760" height="2" rx="1" fill="url(#line)"/>
  <rect x="-160" y="11" width="160" height="2" fill="url(#spark)" clip-path="url(#clip)">
    <animate attributeName="x" values="-160;840" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
