<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-labelledby="title desc">
  <title id="title">Bin0917</title>
  <desc id="desc">Bin0917 profile banner with an Apple-inspired liquid glass effect.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f6ff"/>
      <stop offset=".46" stop-color="#eef9ff"/>
      <stop offset="1" stop-color="#fff5fb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".28" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".58" stop-color="#fff" stop-opacity=".76"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".24"/>
    </linearGradient>
    <filter id="orbBlur" x="-35%" y="-50%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="panel"><rect x="1" y="1" width="838" height="228" rx="32"/></clipPath>
  </defs>
  <g>
    <g clip-path="url(#panel)">
      <rect width="840" height="230" fill="url(#wash)"/>
      <g filter="url(#orbBlur)">
        <circle cx="92" cy="12" r="152" fill="#bbaaff" opacity=".8">
          <animate attributeName="cx" values="92;172;92" dur="18s" repeatCount="indefinite"/>
        </circle>
        <circle cx="756" cy="38" r="168" fill="#9ddfff" opacity=".74">
          <animate attributeName="cy" values="38;88;38" dur="21s" repeatCount="indefinite"/>
        </circle>
        <circle cx="424" cy="252" r="188" fill="#ffc9e6" opacity=".67">
          <animate attributeName="cx" values="424;530;424" dur="24s" repeatCount="indefinite"/>
        </circle>
      </g>
      <ellipse cx="420" cy="24" rx="295" ry="42" fill="#fff" opacity=".34" filter="url(#soft)"/>
      <rect x="15" y="15" width="810" height="200" rx="27" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".42"/>
      <rect x="19" y="19" width="802" height="192" rx="24" fill="url(#reflection)" fill-opacity=".22"/>
      <path d="M22 68C180 4 315 76 464 36S690 12 818 52" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="2"/>
      <path d="M18 185C170 136 302 214 466 166S690 126 824 164" fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="9" filter="url(#soft)"/>
      <text x="420" y="128" text-anchor="middle" fill="#17152d" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-2.5">Bin0917</text>
      <text x="420" y="171" text-anchor="middle" fill="#5b5875" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3.1">FINTECH · BACKEND · AI SECURITY</text>
