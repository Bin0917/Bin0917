<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-labelledby="title desc">
  <title id="title">Bin0917</title>
  <desc id="desc">Bin0917 profile banner with an Apple-inspired liquid glass effect.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f8fc"/>
      <stop offset=".46" stop-color="#edf5fb"/>
      <stop offset="1" stop-color="#f8f5fb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".28" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".58" stop-color="#fff" stop-opacity=".76"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".62"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".24"/>
    </linearGradient>
    <filter id="orbBlur" x="-35%" y="-50%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="panel"><rect x="1" y="1" width="838" height="228" rx="32"/></clipPath>
  </defs>
  <g>
    <g clip-path="url(#panel)">
      <rect width="840" height="230" fill="url(#wash)"/>
      <g filter="url(#orbBlur)">
        <circle cx="92" cy="12" r="152" fill="#c6c8f4" opacity=".48">
          <animate attributeName="cx" values="92;150;92" dur="34s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="12;30;12" dur="41s" repeatCount="indefinite"/>
        </circle>
        <circle cx="756" cy="38" r="168" fill="#b9ddec" opacity=".5">
          <animate attributeName="cx" values="756;700;756" dur="39s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="38;82;38" dur="31s" repeatCount="indefinite"/>
        </circle>
        <circle cx="424" cy="252" r="188" fill="#ead4e4" opacity=".42">
          <animate attributeName="cx" values="424;505;424" dur="43s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="252;226;252" dur="37s" repeatCount="indefinite"/>
        </circle>
      </g>
      <ellipse cx="420" cy="24" rx="295" ry="42" fill="#fff" opacity=".24" filter="url(#soft)">
        <animate attributeName="cx" values="350;490;350" dur="52s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".18;.32;.18" dur="37s" repeatCount="indefinite"/>
      </ellipse>
      <rect x="15" y="15" width="810" height="200" rx="27" fill="#fff" fill-opacity=".28" stroke="#fff" stroke-opacity=".68" stroke-width="1.5"/>
      <rect x="20" y="20" width="800" height="190" rx="23" fill="url(#reflection)" fill-opacity=".16"/>
      <rect x="22" y="22" width="796" height="186" rx="21" fill="none" stroke="#fff" stroke-opacity=".42"/>
      <g>
        <path d="M22 68C180 4 315 76 464 36S690 12 818 52" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="2">
          <animateTransform attributeName="transform" type="translate" values="-24 2;24 -2;-24 2" dur="44s" repeatCount="indefinite"/>
        </path>
        <path d="M18 185C170 136 302 214 466 166S690 126 824 164" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="5" filter="url(#soft)">
          <animate attributeName="stroke-opacity" values=".12;.26;.12" dur="39s" repeatCount="indefinite"/>
        </path>
      </g>
      <path d="M-120 112C120 28 286 36 454 106S716 184 960 82" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="16" filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate" values="-70 0;70 0;-70 0" dur="61s" repeatCount="indefinite"/>
      </path>
      <text x="420" y="128" text-anchor="middle" fill="#151426" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="700" letter-spacing="-2.5">Bin0917</text>
      <text x="420" y="171" text-anchor="middle" fill="#4d4a66" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3.1">FINTECH · BACKEND · AI SECURITY</text>
    </g>
    <rect x=".75" y=".75" width="838.5" height="228.5" rx="31.25" fill="none" stroke="url(#edge)" stroke-width="2"/>
