<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210">
  <style>@font-face{font-family:P;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:P;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')} text{font-family:P,'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif}</style>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE7FF"/><stop offset="0.5" stop-color="#E4F1FF"/><stop offset="1" stop-color="#F6E8FF"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="panel"><rect width="840" height="210" rx="30"/></clipPath>
    <g id="scene">
      <rect width="840" height="210" fill="url(#base)"/>
      <g filter="url(#blur)">
        <circle cx="120" cy="40" r="170" fill="#B7A6FF" opacity="0.85"/>
        <circle cx="720" cy="70" r="160" fill="#9FD8FF" opacity="0.85"/>
        <circle cx="430" cy="230" r="170" fill="#FFC4E6" opacity="0.75"/>
        <circle cx="820" cy="220" r="120" fill="#D9B8FF" opacity="0.8"/>
      </g>
      <text x="420" y="118" text-anchor="middle" font-size="84" font-weight="800" letter-spacing="-2" fill="#1E1B3A">Bin0917</text>
      <text x="420" y="158" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2.4" fill="#5E5A7E">FINTECH · BACKEND · AI SECURITY</text>
    </g>
    <!-- 렌즈 안쪽: 강한 액체 왜곡 (노이즈가 천천히 출렁임) -->
    <filter id="liquid" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="3" result="n">
        <animate attributeName="baseFrequency" values="0.009 0.014;0.014 0.009;0.009 0.014" dur="5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="lens"><rect x="70" y="39" width="230" height="132" rx="66"><animate attributeName="x" values="70;540;70" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect></clipPath>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#panel)">
    <use href="#scene"/>
    <!-- 렌즈 그림자 -->
    <rect x="70" y="49" width="230" height="132" rx="66" fill="#5B4BB7" opacity="0.16" filter="url(#shadow)"><animate attributeName="x" values="70;540;70" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
    <!-- 렌즈 속 왜곡된 장면 -->
    <g clip-path="url(#lens)"><g filter="url(#soft)"><use href="#scene" filter="url(#liquid)"/></g></g>
    <!-- 유리 표면, 림, 반사광 -->
    <rect x="70" y="39" width="230" height="132" rx="66" fill="url(#sheen)"><animate attributeName="x" values="70;540;70" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
    <rect x="70.75" y="39.75" width="228.5" height="130.5" rx="65.25" fill="none" stroke="url(#rim)" stroke-width="1.6"><animate attributeName="x" values="70.75;540.75;70.75" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
    <rect x="136" y="41" width="98" height="1.6" rx="0.8" fill="#FFFFFF" opacity="0.95"><animate attributeName="x" values="136;606;136" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
  </g>
  <rect x="0.5" y="0.5" width="839" height="209" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.8"/>
</svg>
