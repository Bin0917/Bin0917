<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-labelledby="title desc">
  <title id="title">Bin0917</title>
  <desc id="desc">Fintech, backend, and AI security profile banner in a liquid glass style.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0ebff"/>
      <stop offset=".48" stop-color="#e7f6ff"/>
      <stop offset="1" stop-color="#fcecff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".72"/>
      <stop offset=".38" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".72" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".72"/>
    </linearGradient>
    <filter id="blur" x="-35%" y="-50%" width="170%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6b5ec7" flood-opacity=".18"/>
    </filter>
    <clipPath id="panel"><rect width="840" height="230" rx="32"/></clipPath>
    <clipPath id="shineClip"><rect x="1" y="1" width="838" height="228" rx="31"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <g clip-path="url(#panel)">
      <rect width="840" height="230" fill="url(#background)"/>
      <g filter="url(#blur)">
        <circle cx="92" cy="24" r="155" fill="#b9a7ff" opacity=".9">
          <animate attributeName="cx" values="92;180;92" dur="16s" repeatCount="indefinite"/>
        </circle>
        <circle cx="735" cy="48" r="170" fill="#9bdcff" opacity=".86">
          <animate attributeName="cy" values="48;100;48" dur="19s" repeatCount="indefinite"/>
        </circle>
        <circle cx="438" cy="256" r="176" fill="#ffc4e5" opacity=".78">
          <animate attributeName="cx" values="438;540;438" dur="22s" repeatCount="indefinite"/>
        </circle>
        <circle cx="780" cy="218" r="120" fill="#d6b7ff" opacity=".72"/>
      </g>
      <ellipse cx="418" cy="30" rx="310" ry="48" fill="#fff" opacity=".2" filter="url(#blur)"/>
      <rect x="16" y="16" width="808" height="198" rx="25" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".46"/>
      <rect x="20" y="20" width="800" height="190" rx="22" fill="none" stroke="url(#shine)" stroke-width="2"/>
      <g clip-path="url(#shineClip)" opacity=".34">
        <path d="M-80 80C160-25 250 150 460 55S720 10 920 90" fill="none" stroke="#fff" stroke-width="18"/>
        <path d="M-60 190C170 110 260 230 500 145S730 105 900 165" fill="none" stroke="#fff" stroke-width="7"/>
      </g>
      <text x="420" y="128" text-anchor="middle" fill="#1e1b3a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-3">Bin0917</text>
      <text x="420" y="171" text-anchor="middle" fill="#5e5a7e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.8">FINTECH · BACKEND · AI SECURITY</text>
    </g>
    <rect x=".75" y=".75" width="838.5" height="228.5" rx="31.25" fill="none" stroke="#fff" stroke-opacity=".86" stroke-width="1.5"/>
  </g>
</svg>
