name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0B5D4B&color_dots=#ebedf0,#b2e8dc,#5fcfb6,#00a88f,#0b5d4b
            dist/snake-dark.svg?palette=github-dark&color_snake=#00A88F&color_dots=#161b22,#0b3d33,#0b5d4b,#00a88f,#5fcfb6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
